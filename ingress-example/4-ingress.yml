---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  namespace: ingress-example
  labels:
    environment: development
spec:
  ingressClassName: nginx
  rules:
    - host: practice.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caddy-service
                port:
                  number: 80

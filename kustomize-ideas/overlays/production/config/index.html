<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[PROD] Environment Test</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --accent: #2ea043;
      --text: #f0f6fc;
      --muted: #8b949e;
      --border: #2ea043;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background-color: var(--accent);
      color: #fff;
      margin-bottom: 1rem;
    }
    .card {
      background: var(--card-bg);
      border-top: 4px solid var(--border);
      border-radius: 8px;
      padding: 2.5rem;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
    }
    p {
      margin: 0.5rem 0;
      color: var(--muted);
      line-height: 1.5;
    }
    .meta {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #30363d;
      font-size: 0.85rem;
      font-family: monospace;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Production</span>
    <h1>Nginx Test Page</h1>
    <p>This server block is actively routing traffic to the <strong>production</strong> root.</p>
    <div class="meta">
      <div>Status: 200 OK</div>
      <div>Server: Nginx (Active)</div>
      <div id="timestamp">Loaded: </div>
    </div>
  </div>
  <script>
    document.getElementById('timestamp').textContent += new Date().toLocaleTimeString();
  </script>
</body>
</html>

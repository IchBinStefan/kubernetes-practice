---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - resources/namespace.yml
  - ../../base
namespace: kustomize-production
namePrefix: prod-
labels:
  - pairs:
      environment: production
    includeSelectors: true
patches:
  - path: patches/patch-deployment-replicas.yml
configMapGenerator:
  - name: web-page
    files:
      - config/index.html

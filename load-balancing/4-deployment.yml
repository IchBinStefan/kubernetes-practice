---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server-deployment
  namespace: load-balancing-practice
  labels:
    environment: development
spec:
  replicas: 3
  selector:
    matchLabels:
      application: python-web-server
      environment: development
  template:
    metadata:
      name: web-server
      labels:
        application: python-web-server
        environment: development
    spec:
      containers:
        - name: python
          image: python:3.15-slim@sha256:3053ea19f29305df68292b41291d621e0cbc9c1c826822c631713891ea0b64e9
          command: ["python3", "/server/server.py"]
          ports:
            - name: python-port
              containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "50Mi"
            limits:
              cpu: "250m"
              memory: "100Mi"
          volumeMounts:
            - name: python-server
              mountPath: "/server"
              readOnly: true
      volumes:
        - name: python-server
          configMap:
            name: python-server-config-map
            items:
              - key: "python-server"
                path: "server.py"

---
apiVersion: v1
kind: Service
metadata:
  name: load-balancing-service
  namespace: load-balancing-practice
  labels:
    environment: development
spec:
  type: LoadBalancer
  selector:
    application: python-web-server
    environment: development
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: python-port

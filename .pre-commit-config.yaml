---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: '^.*/templates/.*\.yaml$'
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        exclude: '^.*/templates/.*\.yaml$'
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]
        exclude: '^.*/templates/.*\.yaml$'
  # kubeconform does not have a pre-commit hook
  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform
        entry: kubeconform
        language: system
        types: [yaml]
        files: ^(k8s|manifests)/
        args:
          - -summary
          - -strict
  - repo: https://github.com/stackrox/kube-linter
    rev: v0.8.3
    hooks:
      - id: kube-linter
        exclude: (?x)^( examples/| pod-communication/| backup-cronjob/| external-service/| load-balancing/| ingress-example/| gateway-example/| kustomize-ideas/| sailing-day/| ship-happens/ )
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: helmlint

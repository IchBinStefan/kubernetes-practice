<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server VIP - Tzanca Uraganu</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffd700;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            background: linear-gradient(145deg, #1a1a1a, #000000);
        }
        h1 {
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 0;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px #000;
        }
        .subtitle {
            font-size: 1.2em;
            color: #cccccc;
            margin-bottom: 30px;
        }
        img {
            border-radius: 15px;
            border: 4px solid #ffd700;
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 25px;
            object-fit: cover;
        }
        .lyrics {
            font-style: italic;
            font-size: 1.3em;
            background: -webkit-linear-gradient(#ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        .status {
            margin-top: 30px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #222;
            border-radius: 5px;
            font-family: monospace;
            color: #00ff00;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sistemul e pe Val</h1>
        <div class="subtitle">Nginx rulează fără număr, fără număr...</div>

        <!-- Pulling the image directly from the web -->
        <img src="https://i.scdn.co/image/ab6761610000e5ebb8e8ba02f37cbb22f87a8fc9" alt="Tzanca Uraganu" width="400">

        <div class="lyrics">
            "Serverul e blindat, merge site-ul glonț direct!"
        </div>

        <div class="status">
            Status: 200 OK (Valoare Maximă)
        </div>
    </div>
</body>
</html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sailing-day.fullname" . }}
  namespace: {{ include "sailing-day.fullname" . }}
  labels:
    {{- include "sailing-day.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sailing-day.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sailing-day.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          {{ with .Values.port }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}

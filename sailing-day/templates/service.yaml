---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sailing-day.fullname" . }}
  namespace: {{ include "sailing-day.fullname" . }}
  labels:
    {{- include "sailing-day.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sailing-day.selectorLabels" . | nindent 4 }}
  {{ with .Values.servicePort }}
  ports:
    {{- toYaml . | nindent 4 }}
  {{- end }}

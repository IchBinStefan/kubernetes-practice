---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: database-backup-pv
  labels:
    application: database-backup
    environment: development
spec:
  storageClassName: ""
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Delete
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  local:
    path: "/tmp/db-backups"
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - "minikube"

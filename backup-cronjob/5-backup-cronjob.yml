---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: database-backup-cronjob
  namespace: database-practice
  labels:
    environment: development
spec:
  schedule: "* * * * *"
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      name: database-backup-job
      labels:
        environment: development
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      template:
        metadata:
          name: database-backup-pod
          labels:
            environment: development
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:18-alpine@sha256:3b0ef735388b2cb097fc29b8bb421d86d57d0ddbe7aa1fbd6493e06d65028503
              env:
                - name: PGHOST
                  valueFrom:
                    configMapKeyRef:
                      name: database-config-map
                      key: pg-host
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef:
                      name: database-config-map
                      key: pg-port
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: database-config-map
                      key: pg-db
                - name: PGUSER
                  value: admin
                - name: PGPASSWORD
                  value: admin
              command: ["/bin/sh", "/backup/backup.sh"]
              volumeMounts:
                - name: backup-script
                  mountPath: "/backup"
                  readOnly: true
                - name: db-backup
                  mountPath: /backups
          volumes:
            - name: backup-script
              configMap:
                name: backup-config-map
                items:
                  - key: backup-script
                    path: "backup.sh"
            - name: db-backup
              emptyDir: {}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrations-job
  namespace: database-practice
  labels:
    environment: development
spec:
  ttlSecondsAfterFinished: 3600
  completions: 1
  parallelism: 1
  backoffLimit: 2
  template:
    metadata:
      name: migrations-pod
      labels:
        database: postgres
        environment: development
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: postgres:18-alpine@sha256:3b0ef735388b2cb097fc29b8bb421d86d57d0ddbe7aa1fbd6493e06d65028503
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: database-config-map
                  key: pg-host
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: database-config-map
                  key: pg-port
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: database-config-map
                  key: pg-db
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: password
          command: ["/bin/sh", "/migrations/migrations.sh"]
          volumeMounts:
            - name: migrations-script
              mountPath: "/migrations"
              readOnly: true
      volumes:
        - name: migrations-script
          configMap:
            name: migrations-config-map
            items:
              - key: "migrations-script"
                path: "migrations.sh"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: python-job
  namespace: practice
  labels:
    app: processor
spec:
  completions: 6
  parallelism: 3
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: processor
        environment: development
    spec:
      restartPolicy: OnFailure
      containers:
        - name: python-processor
          image: python:3.15-slim@sha256:f786b2e19cf9bb54e96bfcd4c1b40c4c56336c22e60607ffd4b080ae5b5dee83
          command: ["python3", "-c"]
          args:
            - |
              import random, sys, time
              print("worker starting task")
              time.sleep(2)
              failure_chance = 0.5
              roll = random.random()
              if roll < failure_chance:
                print("worker failed to finish")
                sys.exit(1)
              print("worker finished the work successfully")
              sys.exit(0)
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: web-daemon
  namespace: practice
spec:
  selector:
    matchLabels:
      app: web-server-daemon
      environment: development
  template:
    metadata:
      name: web-server
      labels:
        app: web-server-daemon
        environment: development
    spec:
      containers:
        - name: nginx
          image: nginx@sha256:4c41e2d0a3a55b325ed572cd0200bdb72af1433c3daa2bca6ef8eea68ce504a2
          ports:
            - name: default
              containerPort: 80
              protocol: TCP

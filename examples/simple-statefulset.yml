---
apiVersion: v1
kind: Service
metadata:
  name: web-server-service
  namespace: practice
  labels:
    app: web-server
    environment: development
spec:
  selector:
    app: web-server
    environment: development
  clusterIP: None
  ports:
    - name: web-server-port
      port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx-statefulset
  namespace: practice
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-server
      environment: development
  template:
    metadata:
      labels:
        app: web-server
        environment: development
    spec:
      containers:
        - name: nginx
          image: nginx@sha256:4c41e2d0a3a55b325ed572cd0200bdb72af1433c3daa2bca6ef8eea68ce504a2
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-server-volume
              mountPath: /usr/share/nginx/html
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: web-server-volume
      spec:
        accessModes: ["ReadWriteOncePod"]
        storageClassName: "web-server-storage-class"
        resources:
          requests:
            storage: 100Mi

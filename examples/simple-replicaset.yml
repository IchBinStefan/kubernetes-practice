---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-replicaset
  namespace: practice
spec:
  selector:
    matchLabels:
      name: web-server
      environment: development
  replicas: 5
  template:
    metadata:
      labels:
        name: web-server
        environment: development
    spec:
      containers:
        - name: nginx
          image: nginx@sha256:4c41e2d0a3a55b325ed572cd0200bdb72af1433c3daa2bca6ef8eea68ce504a2
          ports:
            - containerPort: 80

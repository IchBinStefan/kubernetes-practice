---
environments:
  dev:
---
releases:
  - name: web-generator
    namespace: "{{ .Environment.Name }}-ns"
    createNamespace: true
    chart: ./charts/generator
    wait: true
  - name: web-server
    namespace: "{{ .Environment.Name }}-ns"
    createNamespace: true
    chart: ./charts/server
    needs:
      - "{{ .Environment.Name }}-ns/web-generator"

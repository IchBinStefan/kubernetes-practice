---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "server.fullname" . }}-service"
  labels:
    {{- include "server.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "server.selectorLabels" . | nindent 4 }}
  {{ with .Values.servicePort }}
  ports:
    {{- toYaml . | nindent 4 }}
  {{- end }}
